
services:
  airflow:
    build: .
    container_name: steam-airflow

    command: standalone

    ports:
      - "8081:8080"

    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      SPARK_LOCAL_IP: "127.0.0.1"

    volumes:
      - airflow-state:/opt/airflow
      - ./dags:/opt/airflow/dags
      - ./src:/opt/steam/src
      - ./data:/opt/steam/data
      - ./pipeline.py:/opt/steam/pipeline.py:ro

    mem_limit: 5g
    cpus: 4

volumes:
  airflow-state:
